{{ define "main" }}
  <article class="doc-article">
    {{ partial "breadcrumbs.html" . }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    {{ .Content }}
    {{ partial "document-meta.html" . }}
    {{ partial "page-nav.html" . }}
  </article>
{{ end }}
