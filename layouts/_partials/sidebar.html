<aside id="docs-sidebar" class="sidebar" aria-label="Documentation navigation" data-docs-sidebar>
  <nav>
    {{ with site.GetPage "docs" }}
      {{ partial "sidebar-tree.html" (dict "page" $ "section" .) }}
    {{ else }}
      <p class="sidebar-empty">Add a <code>content/docs</code> section to get started.</p>
    {{ end }}
  </nav>
</aside>
